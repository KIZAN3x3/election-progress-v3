<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選挙準備管理 v3</title>
<style>
:root{--bg:#ffffff;--accent:#f77f00;--accent2:#e05c00;--text:#1a1a1a;--text2:#5c5650;--text3:#8c8478;--surface:#f5f5f5;--surface2:#ececec;--border:#ddd9d0;--danger:#e74c3c;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{background:var(--surface);border-radius:var(--radius);padding:40px;width:100%;max-width:380px;text-align:center;}
.logo{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.sub{color:var(--text3);font-size:13px;margin-bottom:28px;}
.form-group{margin-bottom:16px;text-align:left;}
.form-group label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:600;}
.form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;outline:none;}
.form-group input:focus{border-color:var(--accent);}
.btn{padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;width:100%;background:var(--accent);color:white;}
.btn:hover{background:var(--accent2);}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🗳 選挙準備管理 v3</div>
  <div class="sub">パスワードを入力してください</div>
  <div class="form-group">
    <label>パスワード</label>
    <input type="password" id="pw" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" onclick="login()">ログイン</button>
  <div class="login-error" id="loginError"></div>
</div>
<script>
const APP_PASSWORD = '123123';
function login(){
  const pw = document.getElementById('pw').value;
  if(pw !== APP_PASSWORD){
    document.getElementById('loginError').textContent = 'パスワードが違います';
    return;
  }
  sessionStorage.setItem('v3_auth', '1');
  location.href = 'list.html';
}
</script>
</body>
</html>
