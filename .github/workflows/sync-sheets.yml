name: Sync candidate sheets to Supabase

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync sheets
        env:
          SUPABASE_KEY: "sb_publishable_UnDHy2FKZHZkUTiSAR8isg_V8B3w4Eb"
          V3_SYNC_TOKEN: ${{ secrets.V3_SYNC_TOKEN }}
          # GOOGLE_SERVICE_ACCOUNT_KEY_B64未設定の間はGOOGLE_SERVICE_ACCOUNT_KEYにフォールバックする
          GOOGLE_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_B64 }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run sync-sheets
