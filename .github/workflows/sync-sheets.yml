name: Sync candidate sheets to Supabase

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync sheets
        env:
          SUPABASE_KEY: "sb_publishable_UnDHy2FKZHZkUTiSAR8isg_V8B3w4Eb"
          V3_SYNC_TOKEN: ${{ secrets.V3_SYNC_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run sync-sheets
