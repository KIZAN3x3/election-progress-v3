<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候補者一覧 - 選挙準備管理 v3</title>
<style>
:root{--bg:#ffffff;--accent:#f77f00;--accent2:#e05c00;--text:#1a1a1a;--text2:#5c5650;--text3:#8c8478;--surface:#f5f5f5;--surface2:#ececec;--border:#ddd9d0;--done:#2ecc71;--danger:#e74c3c;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;}
.app-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.app-header h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-link{margin-left:auto;font-size:13px;font-weight:700;color:white;background:var(--accent);border-radius:var(--radius-sm);padding:8px 14px;text-decoration:none;transition:all .15s;}
.header-link:hover{background:var(--accent2);}
.content{padding:20px;max-width:900px;margin:0 auto;}
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.filter-bar label{font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap;}
.filter-bar select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 12px;font-size:13px;font-family:inherit;outline:none;}
.filter-bar select:focus{border-color:var(--accent);}
.hint{color:var(--text3);font-size:13px;margin-bottom:16px;}
.sync-banner{background:#eef3f6;color:var(--text3);font-size:12px;border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:16px;}
.candidate-list{display:flex;flex-direction:column;gap:10px;}
.candidate-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.candidate-card:hover{border-color:var(--accent);}
.candidate-info{flex:1;min-width:0;}
.candidate-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.candidate-election{font-size:12px;color:var(--text3);}
.candidate-updated{font-size:11px;color:var(--text3);margin-top:2px;}
.candidate-rate{display:flex;align-items:center;gap:10px;width:200px;flex-shrink:0;}
.rate-bar{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.rate-bar-fill{height:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:4px;}
.rate-num{font-size:14px;font-weight:700;width:44px;text-align:right;flex-shrink:0;}
.delete-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.delete-btn:hover{background:var(--danger);border-color:var(--danger);color:white;}
.edit-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.edit-btn:hover{background:var(--accent);border-color:var(--accent);color:white;}
.empty,.loading{color:var(--text3);font-size:13px;padding:40px 0;text-align:center;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--bg);border-radius:var(--radius);padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-box h2{font-size:16px;font-weight:700;margin-bottom:18px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:600;}
.form-group input,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);}
.form-group input:disabled{color:var(--text3);cursor:not-allowed;}
.form-hint{font-size:11px;color:var(--text3);margin-top:5px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.modal-actions .btn-primary{background:var(--accent);color:white;}
.modal-actions .btn-primary:hover{background:var(--accent2);}
.modal-actions .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.modal-actions .btn-secondary{background:var(--surface2);color:var(--text2);}
.modal-actions .btn-secondary:hover{background:var(--border);}
.form-message{font-size:13px;margin-top:14px;text-align:center;min-height:16px;}
.form-message.error{color:var(--danger);}
.form-message.success{color:var(--done);}
</style>
</head>
<body>
<div class="app-header"><h1>🗳 選挙準備管理 v3</h1><a class="header-link" id="registerLink" href="admin.html" style="display:none">+ 候補者を登録</a></div>
<div class="content">
  <div class="filter-bar">
    <label>都道府県で絞り込み</label>
    <select id="prefectureFilter">
      <option value="">すべて</option>
    </select>
  </div>
  <div class="sync-banner">※ 候補者の入力内容は最大15分ごとに自動反映されます</div>
  <div class="hint">候補者名をクリックすると詳細を確認できます</div>
  <div class="candidate-list" id="candidateList"><div class="loading">読み込み中...</div></div>
</div>
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal-box">
    <h2>候補者情報を編集</h2>
    <div class="form-group">
      <label>候補者ID（candidate_code）</label>
      <input type="text" id="editCandidateCode" disabled>
      <div class="form-hint">候補者IDは変更できません</div>
    </div>
    <div class="form-group">
      <label>候補者名</label>
      <input type="text" id="editCandidateName" autocomplete="off">
    </div>
    <div class="form-group">
      <label>選挙名</label>
      <input type="text" id="editElectionName" autocomplete="off">
    </div>
    <div class="form-group">
      <label>都道府県</label>
      <select id="editPrefecture">
        <option value="">選択してください</option>
      </select>
    </div>
    <div class="form-group">
      <label>GoogleスプレッドシートのURLまたはID</label>
      <input type="text" id="editSheetId" placeholder="例: https://docs.google.com/spreadsheets/d/xxxxx/edit" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" id="editSaveBtn" onclick="saveEdit()">更新</button>
    </div>
    <div class="form-message" id="editMessage"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="status-map.js"></script>
<script src="prefectures.js"></script>
<script>
const v3Auth = sessionStorage.getItem('v3_auth');
if(v3Auth !== '1' && v3Auth !== '2'){
  location.href = 'index.html';
}
const isAdmin = v3Auth === '1';
if(isAdmin){
  document.getElementById('registerLink').style.display = '';
}

async function sbFetch(path, options = {}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      ...(options.headers || {})
    }
  });
  return res;
}

async function sbFetchJson(path){
  const res = await sbFetch(path);
  return res.json();
}

let allCandidates = [];
let statsByCandidate = {};

const SHEET_URL_PATTERN = /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/;

function extractSheetId(input){
  const trimmed = input.trim();
  if(!trimmed) return '';
  const match = trimmed.match(SHEET_URL_PATTERN);
  return match ? match[1] : trimmed;
}

const prefectureFilter = document.getElementById('prefectureFilter');
PREFECTURES.forEach(pref => {
  const opt = document.createElement('option');
  opt.value = pref;
  opt.textContent = pref;
  prefectureFilter.appendChild(opt);
});
prefectureFilter.addEventListener('change', () => renderList(prefectureFilter.value));

const editPrefectureSelect = document.getElementById('editPrefecture');
PREFECTURES.forEach(pref => {
  const opt = document.createElement('option');
  opt.value = pref;
  opt.textContent = pref;
  editPrefectureSelect.appendChild(opt);
});

function renderList(prefecture){
  const el = document.getElementById('candidateList');

  if(allCandidates.length === 0){
    el.innerHTML = '<div class="empty">候補者データがありません</div>';
    return;
  }

  const filtered = prefecture ? allCandidates.filter(c => c.prefecture === prefecture) : allCandidates;

  if(filtered.length === 0){
    el.innerHTML = '<div class="empty">該当する候補者がいません</div>';
    return;
  }

  el.innerHTML = filtered.map(c => {
    const stats = statsByCandidate[c.id] || { total: 0, done: 0 };
    const rate = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
    return `<div class="candidate-card" onclick="location.href='detail.html?id=${c.id}'">
      <div class="candidate-info">
        <div class="candidate-name">${escapeHtml(c.name)}</div>
        <div class="candidate-election">${escapeHtml(c.election_name || '')}</div>
        <div class="candidate-updated">${formatLastUpdated(c.last_updated_at)}</div>
      </div>
      <div class="candidate-rate">
        <div class="rate-bar"><div class="rate-bar-fill" style="width:${rate}%"></div></div>
        <div class="rate-num">${rate}%</div>
      </div>
      ${isAdmin ? `<button class="edit-btn" onclick="event.stopPropagation();openEditModal('${c.id}')">編集</button>` : ''}
      ${isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation();deleteCandidate('${c.id}')">削除</button>` : ''}
    </div>`;
  }).join('');
}

async function render(){
  const [candidates, progress] = await Promise.all([
    sbFetchJson('v3_candidates?select=id,candidate_code,name,election_name,prefecture,sheet_id,last_updated_at&order=name.asc'),
    sbFetchJson('v3_progress?select=candidate_id,status')
  ]);

  allCandidates = Array.isArray(candidates) ? candidates : [];

  statsByCandidate = {};
  (progress || []).forEach(p => {
    if(!statsByCandidate[p.candidate_id]) statsByCandidate[p.candidate_id] = { total: 0, done: 0 };
    const stats = statsByCandidate[p.candidate_id];
    stats.total++;
    if(mapStatusStage(p.status) === '納品完了') stats.done++;
  });

  renderList(prefectureFilter.value);
}

function formatLastUpdated(isoString){
  if(!isoString) return '最終更新: -';
  const d = new Date(isoString);
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `最終更新: ${dateStr}`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function deleteCandidate(id){
  const candidate = allCandidates.find(c => c.id === id);
  if(!candidate) return;

  if(!confirm(`本当に削除しますか？（${candidate.name}）`)) return;

  const res = await sbFetch(`v3_candidates?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
  if(!res.ok){
    alert('削除に失敗しました');
    return;
  }

  render();
}

let editingCandidateId = null;

function openEditModal(id){
  const candidate = allCandidates.find(c => c.id === id);
  if(!candidate) return;

  editingCandidateId = id;
  document.getElementById('editCandidateCode').value = candidate.candidate_code || '';
  document.getElementById('editCandidateName').value = candidate.name || '';
  document.getElementById('editElectionName').value = candidate.election_name || '';
  editPrefectureSelect.value = candidate.prefecture || '';
  document.getElementById('editSheetId').value = candidate.sheet_id || '';
  document.getElementById('editMessage').textContent = '';
  document.getElementById('editMessage').className = 'form-message';
  document.getElementById('editModalOverlay').classList.add('open');
}

function closeEditModal(){
  editingCandidateId = null;
  document.getElementById('editModalOverlay').classList.remove('open');
}

function showEditMessage(text, type){
  const el = document.getElementById('editMessage');
  el.textContent = text;
  el.className = 'form-message' + (type ? ' ' + type : '');
}

async function saveEdit(){
  if(!editingCandidateId) return;

  const name = document.getElementById('editCandidateName').value.trim();
  const election = document.getElementById('editElectionName').value.trim();
  const prefecture = editPrefectureSelect.value;
  const sheetId = extractSheetId(document.getElementById('editSheetId').value);
  const saveBtn = document.getElementById('editSaveBtn');

  if(!name || !election || !prefecture){
    showEditMessage('すべての項目を入力してください', 'error');
    return;
  }

  saveBtn.disabled = true;
  showEditMessage('', '');

  try {
    const res = await sbFetch(`v3_candidates?id=eq.${encodeURIComponent(editingCandidateId)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ name, election_name: election, prefecture, sheet_id: sheetId || null })
    });

    if(!res.ok){
      showEditMessage('更新に失敗しました', 'error');
      return;
    }

    closeEditModal();
    render();
  } catch (e) {
    showEditMessage('更新に失敗しました', 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

render();
</script>
</body>
</html>
