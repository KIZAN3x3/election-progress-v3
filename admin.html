<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候補者登録 - 選挙準備管理 v3</title>
<style>
:root{--bg:#ffffff;--accent:#f77f00;--accent2:#e05c00;--text:#1a1a1a;--text2:#5c5650;--text3:#8c8478;--surface:#f5f5f5;--surface2:#ececec;--border:#ddd9d0;--done:#2ecc71;--danger:#e74c3c;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;}
.app-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.app-header h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back-link{margin-left:auto;font-size:13px;color:var(--text2);text-decoration:none;cursor:pointer;}
.back-link:hover{color:var(--accent);}
.content{padding:20px;max-width:480px;margin:0 auto;}
.form-card{background:var(--surface);border-radius:var(--radius);padding:28px;}
.form-card h2{font-size:16px;font-weight:700;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:600;}
.form-group input,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);}
.form-hint{font-size:11px;color:var(--text3);margin-top:5px;}
.btn{padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;width:100%;background:var(--accent);color:white;}
.btn:hover{background:var(--accent2);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.form-message{font-size:13px;margin-top:14px;text-align:center;min-height:16px;}
.form-message.error{color:var(--danger);}
.form-message.success{color:var(--done);}
.divider{border:none;border-top:1px solid var(--border);margin:28px 0;}
.bulk-desc{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.6;}
.bulk-textarea{width:100%;min-height:180px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;font-size:13px;font-family:inherit;outline:none;resize:vertical;margin-bottom:16px;}
.bulk-textarea:focus{border-color:var(--accent);}
.bulk-result{font-size:13px;margin-top:14px;line-height:1.7;}
.bulk-result .result-line{margin-bottom:4px;}
.bulk-result .result-line.success{color:var(--done);}
.bulk-result .result-line.error{color:var(--danger);}
.bulk-result .code-list{font-size:12px;color:var(--text3);background:var(--surface2);border-radius:var(--radius-sm);padding:8px 10px;margin-top:4px;word-break:break-all;}
.users-content{max-width:900px;padding-top:0;}
.users-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.users-head h2{margin-bottom:0 !important;}
.small-btn{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.small-btn:hover{border-color:var(--accent);color:var(--accent2);}
.small-btn:disabled{opacity:.6;cursor:not-allowed;}
.small-btn.primary{background:var(--accent);border-color:var(--accent);color:white;}
.small-btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:white;}
.small-btn.danger:hover{background:var(--danger);border-color:var(--danger);color:white;}
.users-head .small-btn{margin-left:auto;}
.users-group{margin-top:16px;}
.users-group summary{font-size:14px;font-weight:700;cursor:pointer;padding:6px 0;}
.users-group-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.users-empty{font-size:12px;color:var(--text3);padding:8px 0;}
.user-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.user-card-name{font-size:14px;font-weight:700;word-break:break-all;}
.user-card-self{font-size:11px;color:var(--text3);font-weight:600;margin-left:6px;}
.user-card-meta{font-size:12px;color:var(--text2);line-height:1.7;margin-top:4px;word-break:break-all;}
.user-card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
.user-card-actions select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:5px 8px;font-size:12px;font-family:inherit;}
.user-card-note{font-size:11px;color:var(--text3);margin-top:8px;}
body.auth-pending > *{visibility:hidden;}
</style>
</head>
<body class="auth-pending">
<div class="app-header">
  <h1>🗳 選挙準備管理 v3</h1>
  <a class="back-link" href="list.html">← 一覧に戻る</a>
</div>
<div class="content">
  <div class="form-card">
    <h2>候補者を新規登録</h2>
    <form id="candidateForm" onsubmit="return false;">
      <div class="form-group">
        <label>候補者ID（candidate_code）</label>
        <input type="text" id="candidateCode" placeholder="例: test-001" autocomplete="off">
        <div class="form-hint">半角英数字とハイフンのみ使用できます</div>
      </div>
      <div class="form-group">
        <label>候補者名</label>
        <input type="text" id="candidateName" placeholder="候補者名を入力" autocomplete="off">
      </div>
      <div class="form-group">
        <label>選挙名</label>
        <input type="text" id="electionName" placeholder="選挙名を入力" autocomplete="off">
      </div>
      <div class="form-group">
        <label>都道府県</label>
        <select id="prefecture">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label>GoogleスプレッドシートのURLまたはID</label>
        <input type="text" id="sheetId" placeholder="例: https://docs.google.com/spreadsheets/d/xxxxx/edit" autocomplete="off">
        <div class="form-hint">候補者新規作成で作られたシートのURLを貼り付けてください(進捗の自動同期に必須です)</div>
      </div>
      <button class="btn" id="submitBtn" onclick="submitCandidate()">登録</button>
      <div class="form-message" id="formMessage"></div>
    </form>

    <hr class="divider">

    <h2>候補者を一括登録</h2>
    <div class="bulk-desc">Excelから候補者ID・候補者名・選挙名・都道府県・GoogleスプレッドシートのURL（任意）の5列をコピーして、下の欄に貼り付けてください（タブ区切り）</div>
    <textarea class="bulk-textarea" id="bulkText" placeholder="test-001&#9;テスト太郎&#9;テスト選挙&#9;東京都&#9;https://docs.google.com/spreadsheets/d/xxxxx/edit"></textarea>
    <button class="btn" id="bulkSubmitBtn" onclick="submitBulk()">一括登録</button>
    <div class="bulk-result" id="bulkResult"></div>
  </div>
</div>
<div class="content users-content">
  <div class="form-card">
    <div class="users-head">
      <h2>利用者管理</h2>
      <button type="button" class="small-btn" id="usersReloadBtn">↻ 読み直す</button>
    </div>
    <div class="form-message" id="usersMessage"></div>
    <div id="usersList"><div class="loading">読み込み中...</div></div>
  </div>
</div>
<script src="config.js"></script>
<script src="prefectures.js"></script>
<script type="module">
import { requirePageAccess, syncApi, usersApi, ROLE_LABELS } from './auth.js';

const CODE_PATTERN = /^[A-Za-z0-9-]+$/;
const SHEET_URL_PATTERN = /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/;
const SHEET_ID_PATTERN = /^[a-zA-Z0-9_-]{25,}$/;
const MASTER_SHEET_ID = '1q4Vimnn6BHqxCpfcCcRsmvWCvC4J6jGP6avLoOu-mGk';

function extractSheetId(input){
  const trimmed = input.trim();
  if(!trimmed) return '';
  const match = trimmed.match(SHEET_URL_PATTERN);
  return match ? match[1] : trimmed;
}

// 一括登録の5列目を解析する。空欄はok、URL/シートIDらしい文字列もok、
// それ以外（リンク付き文字やチップのコピーなど）はng（形式エラー）として扱う
function parseSheetIdInput(input){
  const trimmed = (input || '').trim();
  if(!trimmed) return { ok: true, id: '' };
  const match = trimmed.match(SHEET_URL_PATTERN);
  if(match) return { ok: true, id: match[1] };
  if(SHEET_ID_PATTERN.test(trimmed)) return { ok: true, id: trimmed };
  return { ok: false, id: '' };
}

// 一括登録の1行分の基本項目（ID・名前・選挙名・都道府県）を検証し、
// 問題があれば具体的な理由を返す（問題なければnull）
function validateBulkRow(code, name, election, prefecture){
  if(!code) return '候補者IDが未入力です';
  if(!CODE_PATTERN.test(code)) return '候補者IDに使えない文字が含まれています（半角英数字とハイフンのみ）';
  if(!name) return '候補者名が未入力です';
  if(!election) return '選挙名が未入力です';
  if(!PREFECTURE_SET.has(prefecture)) return '都道府県名が不正です';
  return null;
}

const prefectureSelect = document.getElementById('prefecture');
PREFECTURES.forEach(pref => {
  const opt = document.createElement('option');
  opt.value = pref;
  opt.textContent = pref;
  prefectureSelect.appendChild(opt);
});

function showMessage(text, type){
  const el = document.getElementById('formMessage');
  el.textContent = text;
  el.className = 'form-message' + (type ? ' ' + type : '');
}

async function submitCandidate(){
  const codeInput = document.getElementById('candidateCode');
  const nameInput = document.getElementById('candidateName');
  const electionInput = document.getElementById('electionName');
  const sheetIdInput = document.getElementById('sheetId');
  const submitBtn = document.getElementById('submitBtn');

  const code = codeInput.value.trim();
  const name = nameInput.value.trim();
  const election = electionInput.value.trim();
  const prefecture = prefectureSelect.value;
  const sheetId = extractSheetId(sheetIdInput.value);

  if(!code || !name || !election || !prefecture){
    showMessage('すべての項目を入力してください', 'error');
    return;
  }
  if(!CODE_PATTERN.test(code)){
    showMessage('候補者IDは半角英数字とハイフンのみ使用できます', 'error');
    return;
  }
  if(sheetId === MASTER_SHEET_ID){
    showMessage('マスターシートのIDです', 'error');
    return;
  }

  submitBtn.disabled = true;
  showMessage('', '');

  try {
    const res = await syncApi({
      action: 'createCandidate',
      candidate_code: code,
      name,
      election_name: election,
      prefecture,
      sheet_id: sheetId || null
    });
    const data = await res.json().catch(() => ({}));
    const result = Array.isArray(data.results) ? data.results[0] : null;

    if(!res.ok || !result || result.status !== 'ok'){
      showMessage((result && result.error) || data.error || '登録に失敗しました', 'error');
      return;
    }

    showMessage('登録しました', 'success');
    codeInput.value = '';
    nameInput.value = '';
    electionInput.value = '';
    prefectureSelect.value = '';
    sheetIdInput.value = '';
  } catch (e) {
    showMessage('登録に失敗しました', 'error');
  } finally {
    submitBtn.disabled = false;
  }
}

const PREFECTURE_SET = new Set(PREFECTURES);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function renderEntryList(entries){
  return `<div class="code-list">${entries.map(e => escapeHtml(`${e.code}: ${e.reason}`)).join('<br>')}</div>`;
}

function renderBulkResult({ insertedCount, formatErrorEntries, duplicateEntries, masterSheetEntries, missingSheetCodes }){
  const el = document.getElementById('bulkResult');
  let html = `<div class="result-line success">${insertedCount}件登録しました</div>`;
  html += `<div class="result-line${formatErrorEntries.length ? ' error' : ''}">${formatErrorEntries.length}件は形式エラーでスキップ</div>`;
  if(formatErrorEntries.length){
    html += renderEntryList(formatErrorEntries);
  }
  html += `<div class="result-line${duplicateEntries.length ? ' error' : ''}">${duplicateEntries.length}件は既存IDと重複のためスキップ</div>`;
  if(duplicateEntries.length){
    html += renderEntryList(duplicateEntries);
  }
  html += `<div class="result-line${masterSheetEntries.length ? ' error' : ''}">${masterSheetEntries.length}件はマスターシートのIDが入力されているためスキップ</div>`;
  if(masterSheetEntries.length){
    html += renderEntryList(masterSheetEntries);
  }
  if(missingSheetCodes.length){
    html += `<div class="result-line error">シート未設定：${missingSheetCodes.length}件（ID一覧）</div>`;
    html += `<div class="code-list">${missingSheetCodes.map(escapeHtml).join(', ')}</div>`;
  }
  el.innerHTML = html;
}

async function submitBulk(){
  const textarea = document.getElementById('bulkText');
  const bulkSubmitBtn = document.getElementById('bulkSubmitBtn');
  const resultEl = document.getElementById('bulkResult');

  const lines = textarea.value.split(/\r\n|\r|\n/).filter(line => line.trim() !== '');

  const formatErrorEntries = [];
  const duplicateEntries = [];
  const masterSheetEntries = [];
  const candidateRows = [];
  const seenCodes = new Set();
  const missingSheetCandidateSet = new Set();

  lines.forEach((line, i) => {
    const rawCols = line.split('\t');
    // 姓・名の列が先頭に付いた7列（姓・名・ID・名前・選挙名・都道府県・URL）で
    // 貼り付けられた場合は、後ろ5列（ID・名前・選挙名・都道府県・URL）を使う
    const cols = rawCols.length >= 7 ? rawCols.slice(rawCols.length - 5) : rawCols;
    const code = (cols[0] || '').trim();
    const name = (cols[1] || '').trim();
    const election = (cols[2] || '').trim();
    const prefecture = (cols[3] || '').trim();
    const sheetInput = cols[4] || '';

    const label = code || `(${i + 1}行目: ID未入力)`;

    const rowError = validateBulkRow(code, name, election, prefecture);
    if(rowError){
      formatErrorEntries.push({ code: label, reason: rowError });
      return;
    }

    const parsedSheet = parseSheetIdInput(sheetInput);
    if(!parsedSheet.ok){
      formatErrorEntries.push({ code: label, reason: 'シート列がURLでもシートIDでもない形式です' });
      return;
    }

    if(parsedSheet.id === MASTER_SHEET_ID){
      masterSheetEntries.push({ code: label, reason: 'マスターシートのIDです' });
      return;
    }

    if(seenCodes.has(code)){
      duplicateEntries.push({ code, reason: '貼り付け内で候補者IDが重複しています' });
      return;
    }
    seenCodes.add(code);
    if(!parsedSheet.id){
      missingSheetCandidateSet.add(code);
    }
    candidateRows.push({ candidate_code: code, name, election_name: election, prefecture, sheet_id: parsedSheet.id || null });
  });

  if(candidateRows.length === 0){
    renderBulkResult({ insertedCount: 0, formatErrorEntries, duplicateEntries, masterSheetEntries, missingSheetCodes: [] });
    return;
  }

  bulkSubmitBtn.disabled = true;
  resultEl.innerHTML = '';

  try {
    const res = await syncApi({
      action: 'createCandidate',
      candidates: candidateRows.map(row => ({
        candidate_code: row.candidate_code,
        name: row.name,
        election_name: row.election_name,
        prefecture: row.prefecture,
        sheet_id: row.sheet_id
      }))
    });
    const data = await res.json().catch(() => ({}));
    const results = Array.isArray(data.results) ? data.results : [];

    if(!res.ok && results.length === 0){
      resultEl.innerHTML = `<div class="result-line error">${escapeHtml(data.error || '一括登録に失敗しました')}</div>`;
      return;
    }

    let insertedCount = 0;
    const missingSheetCodes = [];
    results.forEach(r => {
      if(r.status === 'ok'){
        insertedCount++;
        if(missingSheetCandidateSet.has(r.candidate_code)){
          missingSheetCodes.push(r.candidate_code);
        }
      } else if(r.reason === 'duplicate'){
        duplicateEntries.push({ code: r.candidate_code, reason: r.error || 'この候補者IDは既に登録されています' });
      } else if(r.reason === 'master_sheet'){
        masterSheetEntries.push({ code: r.candidate_code, reason: r.error || 'マスターシートのIDです' });
      } else {
        formatErrorEntries.push({ code: r.candidate_code, reason: r.error || '登録に失敗しました' });
      }
    });

    if(insertedCount > 0){
      textarea.value = '';
    }

    renderBulkResult({ insertedCount, formatErrorEntries, duplicateEntries, masterSheetEntries, missingSheetCodes });
  } catch (e) {
    resultEl.innerHTML = '<div class="result-line error">一括登録に失敗しました</div>';
  } finally {
    bulkSubmitBtn.disabled = false;
  }
}

// ---------- 利用者管理 ----------

let currentUser = null;
const USER_GROUPS = [
  { status: 'pending', label: '承認待ち', open: true },
  { status: 'active', label: '有効', open: false },
  { status: 'disabled', label: '無効', open: false }
];
// 読み直しても、開いているグループはそのままにする
const openGroups = new Set(USER_GROUPS.filter(g => g.open).map(g => g.status));

function showUsersMessage(text, type){
  const el = document.getElementById('usersMessage');
  el.textContent = text;
  el.className = 'form-message' + (type ? ' ' + type : '');
}

function formatDateTime(value){
  if(!value) return '-';
  const d = new Date(value);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function node(tag, className, text){
  const el = document.createElement(tag);
  if(className) el.className = className;
  if(text !== undefined) el.textContent = text;
  return el;
}

function smallButton(label, className, onClick){
  const btn = node('button', 'small-btn' + (className ? ' ' + className : ''), label);
  btn.type = 'button';
  btn.addEventListener('click', onClick);
  return btn;
}

function roleSelect(selected){
  const select = document.createElement('select');
  for(const role of ['viewer', 'admin']){
    const opt = node('option', '', ROLE_LABELS[role]);
    opt.value = role;
    if(role === selected) opt.selected = true;
    select.appendChild(opt);
  }
  return select;
}

async function loadUsers(){
  const listEl = document.getElementById('usersList');
  const reloadBtn = document.getElementById('usersReloadBtn');
  reloadBtn.disabled = true;
  try {
    const { users } = await usersApi('list');
    renderUsers(Array.isArray(users) ? users : []);
  } catch (e) {
    listEl.innerHTML = '';
    listEl.appendChild(node('div', 'users-empty', e.message || '利用者一覧の取得に失敗しました'));
  } finally {
    reloadBtn.disabled = false;
  }
}

function renderUsers(users){
  const listEl = document.getElementById('usersList');
  listEl.innerHTML = '';
  for(const group of USER_GROUPS){
    const members = users.filter(u => u.status === group.status);
    const details = node('details', 'users-group');
    details.open = openGroups.has(group.status);
    details.addEventListener('toggle', () => {
      if(details.open) openGroups.add(group.status); else openGroups.delete(group.status);
    });
    details.appendChild(node('summary', '', `${group.label}（${members.length}人）`));
    const list = node('div', 'users-group-list');
    if(members.length === 0){
      list.appendChild(node('div', 'users-empty', 'いません'));
    }
    members.forEach(u => list.appendChild(createUserCard(u)));
    details.appendChild(list);
    listEl.appendChild(details);
  }
}

function createUserCard(user){
  const isSelf = currentUser && user.id === currentUser.id;
  const card = node('div', 'user-card');

  const name = node('div', 'user-card-name', user.display_name);
  if(isSelf) name.appendChild(node('span', 'user-card-self', '（自分）'));
  card.appendChild(name);

  const meta = node('div', 'user-card-meta');
  meta.append(
    node('div', '', `メール：${user.email || '-'}`),
    node('div', '', `役割：${ROLE_LABELS[user.role] || user.role}`),
    node('div', '', `申請日時：${formatDateTime(user.created_at)}`),
    node('div', '', `最終ログイン：${formatDateTime(user.last_login_at)}`)
  );
  card.appendChild(meta);

  if(isSelf){
    card.appendChild(node('div', 'user-card-note', '自分自身の無効化・役割変更・削除はできません'));
    return card;
  }

  const actions = node('div', 'user-card-actions');
  if(user.status === 'pending'){
    const select = roleSelect('viewer');
    actions.append(
      select,
      smallButton('承認する', 'primary', () => {
        const role = select.value;
        runUserAction({ action: 'approve', target_id: user.id, role }, `${user.display_name}さんを「${ROLE_LABELS[role]}」として承認しますか？`);
      }),
      smallButton('無効にする', '', () => runUserAction({ action: 'disable', target_id: user.id }, `${user.display_name}さんを無効にしますか？`)),
      smallButton('削除', 'danger', () => deleteUser(user))
    );
  } else if(user.status === 'active'){
    const select = roleSelect(user.role);
    actions.append(
      select,
      smallButton('役割を変更', '', () => {
        const role = select.value;
        if(role === user.role){
          showUsersMessage('役割が変わっていません', 'error');
          return;
        }
        runUserAction({ action: 'set_role', target_id: user.id, role }, `${user.display_name}さんを「${ROLE_LABELS[role]}」にしますか？`);
      }),
      smallButton('無効にする', '', () => runUserAction({ action: 'disable', target_id: user.id }, `${user.display_name}さんを無効にしますか？`)),
      smallButton('削除', 'danger', () => deleteUser(user))
    );
  } else {
    actions.append(
      smallButton('再有効化する', 'primary', () => runUserAction({ action: 'enable', target_id: user.id }, `${user.display_name}さんを再び使えるようにしますか？`)),
      smallButton('削除', 'danger', () => deleteUser(user))
    );
  }
  card.appendChild(actions);
  return card;
}

async function runUserAction(payload, confirmMessage){
  if(!confirm(confirmMessage)) return;
  showUsersMessage('', '');
  try {
    await usersApi(payload.action, payload);
    showUsersMessage('変更しました', 'success');
  } catch (e) {
    showUsersMessage(e.message, 'error');
  }
  await loadUsers();
}

async function deleteUser(user){
  if(!confirm(`${user.display_name}さんを削除しますか？`)) return;
  if(!confirm('元に戻せません。本当に削除しますか？')) return;
  showUsersMessage('', '');
  try {
    const result = await usersApi('delete', { target_id: user.id });
    if(result.warning){
      alert(result.warning);
      showUsersMessage(result.warning, 'error');
    } else {
      showUsersMessage('削除しました', 'success');
    }
  } catch (e) {
    showUsersMessage(e.message, 'error');
  }
  await loadUsers();
}

document.getElementById('usersReloadBtn').addEventListener('click', () => {
  showUsersMessage('', '');
  loadUsers();
});

// HTML の onclick から呼ぶ関数（type="module" のスクリプトはグローバルにならないため）
Object.assign(window, { submitCandidate, submitBulk });

currentUser = await requirePageAccess({ adminOnly: true });
if(currentUser){
  loadUsers();
}
</script>
